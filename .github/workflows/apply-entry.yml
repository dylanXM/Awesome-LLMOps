name: apply-entry
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply entry insertion
        run: |
          python3 - << 'PYEOF'
          import io, sys
          path = "README.md"
          entry = "| [PromptProof](https://github.com/dylanXM/promptproof) | Snapshot & regression testing for LLM prompts. Define YAML test suites with assertions, run them in CI against any OpenAI-compatible endpoint, and catch prompt or model regressions before they ship. Also on PyPI as `promptproof-cli`. | ![GitHub Badge](https://img.shields.io/github/stars/dylanXM/promptproof.svg?style=flat-square) |"
          with io.open(path, encoding="utf-8") as f:
              lines = f.read().split("\n")
          if any("dylanXM/promptproof" in ln for ln in lines):
              print("already present")
              sys.exit(0)
          idx = [i for i, ln in enumerate(lines) if ln.startswith("| [promptfoo]")]
          assert len(idx) == 1, "anchor count %s" % len(idx)
          lines.insert(idx[0] + 1, entry)
          with io.open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write("\n".join(lines))
          print("inserted")
          PYEOF
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-entry.yml
          git add -A
          git commit -m "Add PromptProof (prompt snapshot & regression testing CLI)"
          git push
